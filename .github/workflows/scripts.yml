name: Scripts Quality

on:
  push:
    branches: [main]
    paths:
      - "scripts/check_budget_warnings.py"
      - "scripts/tests/**"
      - "pyproject.toml"
      - ".github/workflows/scripts.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/check_budget_warnings.py"
      - "scripts/tests/**"
      - "pyproject.toml"
      - ".github/workflows/scripts.yml"

jobs:
  python-checks:
    name: Lint & Test Python Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          ruff check scripts/check_budget_warnings.py scripts/tests/

      - name: Run pytest
        run: |
          pytest scripts/tests/ -v --tb=short
