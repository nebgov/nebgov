name: CLI

on:
  push:
    paths:
      - 'packages/cli/**'
      - 'sdk/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'sdk/**'
      - '.github/workflows/cli.yml'

jobs:
  test:
    name: CLI Type check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The CLI compiles and tests against the SDK's emitted dist/. SDK type
      # errors are enforced by sdk.yml; here we only need the output to exist,
      # so a CLI change that breaks against the current SDK API fails below.
      - name: Build SDK
        run: pnpm --filter @nebgov/sdk exec tsc || test -f sdk/dist/index.d.ts

      - name: Type check
        run: pnpm --filter @nebgov/cli run lint

      - name: Unit tests
        run: pnpm --filter @nebgov/cli run test

      - name: Build CLI
        run: pnpm --filter @nebgov/cli run build

      - name: Smoke test binary
        run: node packages/cli/dist/index.js --help
